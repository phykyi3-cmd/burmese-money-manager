<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#e2e8f0" stroke-width="4"/>

  <!-- Donut Chart Ring -->
  <g transform="translate(256, 256) rotate(-90)" filter="url(#shadow)">
    <!-- Red Segment (Expenses ~40%) -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#EF4444" stroke-width="44"
            stroke-dasharray="351 880" stroke-dashoffset="0" stroke-linecap="round"/>
    
    <!-- Blue Segment (Savings/Transfers ~25%) -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#3B82F6" stroke-width="44"
            stroke-dasharray="220 880" stroke-dashoffset="-370" stroke-linecap="round"/>

    <!-- Green Segment (Income/Surplus ~35%) -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#10B981" stroke-width="44"
            stroke-dasharray="308 880" stroke-dashoffset="-610" stroke-linecap="round"/>
  </g>

  <!-- Central Golden Dollar Coin -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="82" fill="url(#goldGrad)" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#FEF08A" stroke-width="4" stroke-dasharray="8 6"/>
    <!-- Dollar Sign -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="94" font-weight="900" fill="#FFFFFF" text-anchor="middle"
          style="filter: drop-shadow(0 2px 4px rgba(180, 83, 9, 0.4));">$</text>
  </g>
</svg>
