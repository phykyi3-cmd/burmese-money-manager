<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131B"/>
      <stop offset="100%" stop-color="#06080C"/>
    </linearGradient>
    <linearGradient id="dollarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D084" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Apple Squircle Frame -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Inner Soft Ring & Atmosphere -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="150" fill="url(#softGlow)"/>

  <!-- Crisp Minimalist Dollar Sign -->
  <text x="256" y="254" 
        dominant-baseline="central"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="280" 
        font-weight="700" 
        fill="url(#dollarGrad)">$</text>
</svg>
